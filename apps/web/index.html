    <!-- Structured Data (SEO & AEO: Organization, SoftwareApplication, BreadcrumbList, FAQPage) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "@id": "https://purepathwebsolutions.com/#organization",
            "name": "Pure Path",
            "url": "https://purepathwebsolutions.com",
            "logo": "https://purepathwebsolutions.com/brand/pure-path-mark.png"
          },
          {
            "@type": "SoftwareApplication",
            "@id": "https://purepathwebsolutions.com/purescribe#software",
            "name": "Pure Scribe",
            "applicationCategory": "HealthApplication",
            "operatingSystem": "Web, Chrome Extension",
            "url": "https://purepathwebsolutions.com/purescribe",
            "publisher": { "@id": "https://purepathwebsolutions.com/#organization" },
            "description": "Ambient AI medical scribe for private and specialty clinics featuring custom EMR integration, 1-click unanswered-field completion, and zero-retention RAM transcript purging."
          },
          {
            "@type": "BreadcrumbList",
            "itemListElement": [
              {
                "@type": "ListItem",
                "position": 1,
                "name": "Pure Path",
                "item": "https://purepathwebsolutions.com"
              },
              {
                "@type": "ListItem",
                "position": 2,
                "name": "Pure Scribe",
                "item": "https://purepathwebsolutions.com/purescribe"
              }
            ]
          },
          {
            "@type": "FAQPage",
            "mainEntity": [
              {
                "@type": "Question",
                "name": "How does Pure Scribe integrate with clinic EMRs like DrChrono?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Pure Path works directly with your practice to map custom specialty templates and integrate Pure Scribe into your EMR—supporting DrChrono API and browser side-panel workflows as well as major clinic EHR systems."
                }
              },
              {
                "@type": "Question",
                "name": "What happens to the raw encounter transcript after the note is filled?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Pure Scribe holds transcripts strictly in volatile memory (RAM) during review. Once the structured note is transferred to your EMR, the raw transcript buffer is overwritten with zeros and discarded with a PHI-free verification receipt."
                }
              },
              {
                "@type": "Question",
                "name": "How does Pure Scribe handle clinical details that were not spoken aloud?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Rather than fabricating unverified statements into completed fields, Pure Scribe flags unanswered or incomplete fields inline and presents context-aware options that the physician can verify and insert in one click."
                }
              },
              {
                "@type": "Question",
                "name": "How does Pure Scribe work with Pure Knowledge?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Pure Knowledge is Pure Path's AI brain for your business—connecting clinic SOPs, fee schedules, prior-authorization criteria, and operational workflows alongside Pure Scribe's clinical documentation."
                }
              }
            ]
          }
        ]
      }
    </script>
